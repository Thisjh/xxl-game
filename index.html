<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>萌宠连连看 - 经典连线消除</title>
<meta name="description" content="萌宠连连看：点两个相同的萌宠，用连线接通就消除。56 款可爱卡通图案，向中心靠拢的关卡挑战。">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;width:100%;
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;background:var(--bg3);
}
:root{
  /* 背景渐变（薄荷白 → 淡粉） */
  --bg1:#F0FBFA;--bg2:#DCF2EE;--bg3:#FFE9F1;--bg4:#FFD2DF;
  /* 卡片面（白 → 极淡薄荷） */
  --card1:#FFFFFF;--card2:#F0FAF8;--card-shadow:#C9E2DD;
  /* 强调 / 行动色（莓粉 + 青绿） */
  --accent:#FF6FA5;--accent-d:#E5508A;
  /* UI 面（白） */
  --ui1:#FFFFFF;--ui2:#F2FAF9;--ui-shadow:#B5D9D2;--text:#2D4A45;
  /* 语义色 */
  --ok:#2BC4B0;--ok-d:#1FA395;
  --warn:#FF8FB8;
  --danger:#FF5C7A;--danger-d:#D63A5A;
  --info:#6FA8FF;
  /* 阴影层级（轻磨砂，去厚卡） */
  --sh-card:0 4px 14px rgba(80,140,130,.18),0 1px 3px rgba(0,0,0,.06);
  --sh-card-active:0 2px 8px rgba(80,140,130,.20);
  --sh-ui:0 3px 10px rgba(80,140,130,.16);
  --sh-ui-active:0 1px 3px rgba(80,140,130,.16);
  --sh-ui-sm:0 2px 6px rgba(80,140,130,.14);
  --sh-modal:0 24px 60px rgba(80,140,130,.25);
  --sh-btn:0 4px 0 #1FA395;
  --sh-btn-active:0 1px 0 #1FA395;
  --sh-btn-2:0 4px 0 #C73D74;
  --sh-btn-2-active:0 1px 0 #C73D74;
  --sh-glow:0 0 0 4px var(--accent),0 9px 18px rgba(229,80,138,.3);
  /* 圆角 */
  --r-sm:10px;--r-md:12px;--r-lg:16px;--r-xl:24px;--r-pill:24px;
  /* 间距 */
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;
  /* 字号 */
  --f-title:15px;--f-sub:14px;--f-body:13px;--f-num:24px;
  --tile-size:46px;
}
#svg-defs{position:absolute;width:0;height:0;overflow:hidden}
#bg-layer{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(circle at 75% 15%, var(--bg4), transparent 45%),
    radial-gradient(circle at 18% 8%, rgba(255,255,255,.5), transparent 40%),
    radial-gradient(circle at 88% 95%, rgba(255,180,205,.42), transparent 46%),
    radial-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%),
    radial-gradient(ellipse at center, transparent 55%, rgba(120,90,110,.22) 100%);
}
#bg-layer::after{
  content:'';position:absolute;inset:-20%;
  background:radial-gradient(circle at 30% 70%, rgba(255,255,255,.12), transparent 42%);
  animation:bgDrift 14s ease-in-out infinite alternate;
}
@keyframes bgDrift{0%{transform:translate(0,0)}100%{transform:translate(7%,-6%)}}
#game{position:relative;z-index:1;height:100vh;height:100dvh;width:100vw;
  display:flex;flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
#topbar{width:100%;max-width:460px;padding:12px 14px 6px;display:flex;flex-direction:column;gap:8px}
#level-row{display:flex;align-items:center;gap:10px}
#level-badge{
  background:linear-gradient(160deg,var(--ui1),var(--ui2));
  border-radius:var(--r-pill);padding:8px 20px;font-weight:900;font-size:var(--f-sub);color:var(--text);
  box-shadow:var(--sh-ui);letter-spacing:1px;border:1.5px solid var(--ui-shadow);white-space:nowrap;flex:0 0 auto}
.home-circle{
  width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ui-shadow);cursor:pointer;font-size:19px;
  background:linear-gradient(160deg,var(--ui1),var(--ui2));
  box-shadow:var(--sh-ui-sm);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.home-circle:active{transform:translateY(3px);box-shadow:var(--sh-ui-active)}
#coin-badge{
  background:linear-gradient(160deg,var(--ui1),var(--ui2));border-radius:var(--r-pill);
  padding:9px 16px;font-weight:900;font-size:var(--f-sub);color:var(--text);
  box-shadow:var(--sh-ui);border:1.5px solid var(--ui-shadow);display:flex;align-items:center;gap:5px;margin-left:auto}
.sound-group{display:flex;gap:8px;flex:0 0 auto}
#progress-box{background:rgba(255,255,255,.7);border-radius:14px;padding:5px;height:20px;position:relative;overflow:hidden;box-shadow:inset 0 1px 3px rgba(80,140,130,.18);border:1.5px solid var(--card-shadow)}
#progress-fill{height:100%;width:0%;border-radius:9px;background:linear-gradient(90deg,#FF6FA5,#FFA8C9);
  transition:width .45s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 8px rgba(255,111,165,.45)}
#progress-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#board-wrap{flex:1;width:100%;max-width:460px;display:flex;align-items:center;justify-content:center;padding:8px 10px;position:relative}
#board{display:grid;gap:4px;position:relative}
.tile{
  width:var(--tile-size);height:var(--tile-size);
  background:linear-gradient(160deg,var(--card1),var(--card2));
  border-radius:12px;border:2px solid var(--card-shadow);
  box-shadow:0 5px 14px rgba(74,130,122,.32),0 2px 4px rgba(0,0,0,.10),inset 0 1px 2px rgba(255,255,255,.9);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--card-shadow),inset 0 2px 3px rgba(255,255,255,.6)}
.tile svg{width:88%;height:88%;display:block;transform-origin:center}
.tile .emoji{width:88%;height:88%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--tile-size)*0.58);line-height:1;user-select:none;-webkit-user-select:none}
.tile.selected{
  transform:translateY(-2px) scale(1.06);
  background:linear-gradient(160deg,var(--card1),var(--card2));
  box-shadow:0 0 0 4px var(--accent),0 9px 18px rgba(0,0,0,.4),inset 0 2px 3px rgba(255,255,255,.6);
  z-index:3;}
.tile.hint{animation:hintPulse .7s ease-in-out 3}
@keyframes hintPulse{0%,100%{box-shadow:0 6px 0 var(--card-shadow),0 8px 12px rgba(0,0,0,.18)}
  50%{box-shadow:0 0 0 5px #ffe24a,0 9px 16px rgba(255,210,0,.6);transform:scale(1.05)}}
.tile.matched{animation:popOut .35s cubic-bezier(.5,-0.5,.3,1.5) forwards}
@keyframes popOut{0%{transform:scale(1)}40%{transform:scale(1.25);opacity:1}100%{transform:scale(0);opacity:0}}
/* 动态图案动画 */
@keyframes abob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes arot{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes afloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.06)}}
@keyframes atwinkle{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.tile svg.a-bob{animation:abob 1.8s ease-in-out infinite}
.tile svg.a-rot{animation:arot 2.2s ease-in-out infinite}
.tile svg.a-float{animation:afloat 2.6s ease-in-out infinite}
.tile svg.a-twinkle{animation:atwinkle 1.5s ease-in-out infinite}
#svg-lines{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:visible}
#tools{width:100%;max-width:460px;display:flex;gap:10px;justify-content:center;padding:8px 14px 16px}
.tool{flex:1;max-width:130px;background:linear-gradient(160deg,var(--ui1),var(--ui2));border-radius:var(--r-lg);padding:10px 4px 8px;text-align:center;cursor:pointer;position:relative;
  box-shadow:var(--sh-ui);
  border:1.5px solid var(--ui-shadow);transition:transform .1s}
.tool:active{transform:translateY(4px);box-shadow:var(--sh-ui-active)}
.tool-icon{font-size:30px;line-height:1}
.tool-name{font-size:13px;color:var(--text);font-weight:900;margin-top:3px}
.tool-count{position:absolute;top:-7px;right:-7px;background:var(--danger);color:#fff;border-radius:50%;min-width:22px;height:22px;line-height:22px;font-size:12px;font-weight:900;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.tool.used{opacity:.45;filter:grayscale(1)}
.particle{position:absolute;border-radius:50%;pointer-events:none;z-index:6}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.overlay.hidden{display:none}
.modal{background:linear-gradient(160deg,var(--ui1),var(--ui2));border-radius:var(--r-xl);padding:28px 24px;width:88%;max-width:340px;text-align:center;box-shadow:var(--sh-modal);border:3px solid #fff}
.modal h2{font-size:24px;color:var(--text);margin-bottom:6px;font-weight:900}
.modal p{color:var(--text);opacity:.8;font-size:var(--f-body);line-height:1.7;margin:6px 0}
.modal .btn{display:inline-block;margin-top:14px;padding:13px 36px;border-radius:var(--r-pill);border:none;font-size:17px;font-weight:900;color:#fff;background:linear-gradient(135deg,#FF9CC0,#FF6FA5);box-shadow:var(--sh-btn-2);cursor:pointer;transition:transform .1s}
.modal .btn:active{transform:translateY(4px);box-shadow:var(--sh-btn-active)}
.modal .btn.secondary{background:linear-gradient(135deg,#FFFFFF,#F0FAF8);box-shadow:var(--sh-ui-sm);margin-left:8px;font-size:15px;color:var(--text);border:1px solid rgba(180,217,210,.5)}
.modal .btn.secondary:active{box-shadow:var(--sh-btn-2-active)}
/* KIKI 生日卡片（8月3日每关弹出） *//* 主页 */
.modal.home{padding:30px 24px}
.home-logo{display:flex;align-items:center;justify-content:center;gap:8px;font-size:40px;font-weight:900;color:var(--text)}
.home-logo span{font-size:34px}
.home-logo .logo-pet{width:48px;height:48px;flex:0 0 auto;margin-right:4px}
.home-sub{opacity:.7;font-size:var(--f-body);margin:2px 0 16px}
.home-stats{display:flex;gap:14px;justify-content:center;margin-bottom:18px}
.stat{background:rgba(0,0,0,.1);border-radius:var(--r-md);padding:10px 18px;min-width:90px}
.stat-num{font-size:var(--f-num);font-weight:900;color:var(--text)}
.stat-lbl{font-size:12px;opacity:.7}
.home-row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:nowrap}
.modal .btn.big{width:100%;padding:15px;font-size:19px;margin-top:6px;border-radius:var(--r-pill)}
.modal .btn.sm{padding:10px 18px;font-size:14px;margin-left:0;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;min-width:0;border-radius:var(--r-pill)}
/* 商店/图案 */
.shop-list{display:flex;flex-direction:column;gap:10px;margin:14px 0;max-height:46vh;overflow:auto}
.shop-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.55);border-radius:var(--r-md);padding:10px 12px;text-align:left;box-shadow:0 2px 5px rgba(80,140,130,.08)}
.shop-item .si-icon{font-size:26px;width:34px;text-align:center}
.shop-item .si-info{flex:1}
.shop-item .si-name{font-weight:900;color:var(--text);font-size:15px}
.shop-item .si-desc{font-size:11px;opacity:.65;margin-top:1px}
.shop-item .si-buy{background:linear-gradient(135deg,#FF9CC0,#FF6FA5);color:#fff;border:none;border-radius:var(--r-pill);padding:8px 14px;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 3px 0 #C73D74;white-space:nowrap}
.shop-item .si-buy:active{transform:translateY(2px);box-shadow:0 1px 0 #C73D74}
.shop-item .si-buy.owned{background:linear-gradient(135deg,#bbb,#999);box-shadow:0 3px 0 #777}
.shop-item .si-buy.cant{opacity:.5}
.skin-chip{display:inline-block;width:44px;height:26px;border-radius:8px;border:2px solid #fff;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);flex-shrink:0}
.skin-chip.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
/* 商店图标区：给色块留够空间 */
.shop-item .si-icon{font-size:26px;min-width:44px;text-align:center;flex-shrink:0}
.shop-item .si-info{flex:1;min-width:0}
/* 图案预览 */
.pack-preview{display:flex;gap:4px;margin-top:4px}
.pack-preview .ppv{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pack-preview .ppv svg{width:26px;height:26px}
/* 图案管理网格 */
.icon-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.icon-card{width:62px;text-align:center;cursor:pointer;border-radius:12px;padding:6px 4px;background:rgba(255,255,255,.55);border:2px solid transparent;transition:all .15s;position:relative;box-shadow:0 2px 5px rgba(80,140,130,.1)}
.icon-card:hover{background:rgba(0,0,0,.12)}
.icon-card.active{border-color:var(--accent);background:rgba(255,200,100,.2);box-shadow:0 0 8px rgba(255,140,0,.3)}
.icon-card.locked{opacity:.35;filter:grayscale(1);pointer-events:none}
.icon-card.replace-sel{border-color:#e91e63;box-shadow:0 0 10px rgba(233,30,99,.6);transform:scale(1.06);background:rgba(255,180,210,.25)}
.icon-card.locked .ic-lock{position:absolute;top:2px;right:4px;font-size:10px}
.replace-hint{font-size:12px;color:var(--text);opacity:.7;background:rgba(0,0,0,.06);border-radius:10px;padding:6px 10px;margin-bottom:6px;text-align:center}
.replace-hint.active{background:rgba(233,30,99,.15);color:#c2185b;font-weight:700;opacity:1}
.shop-item.locked-set{opacity:.55}
.icon-card svg{width:38px;height:38px;display:block;margin:0 auto 3px}
.icon-card .ic-name{font-size:10px;color:var(--text);font-weight:700;line-height:1.2;opacity:.8}
.section-title{font-size:15px;font-weight:900;color:var(--text);margin:14px 0 8px;text-align:left;border-bottom:2px solid rgba(0,0,0,.08);padding-bottom:4px}
#combo-pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:50px;font-weight:900;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.4);pointer-events:none;z-index:50;opacity:0}
#combo-pop.show{animation:comboFly .85s ease-out forwards}
@keyframes comboFly{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-72%) scale(1)}}
/* 关卡顶部：音效开关 + 靠拢方向提示条 */
.snd-btn{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--ui1),var(--ui2));box-shadow:var(--sh-ui-sm);position:relative;padding:0;border:1.5px solid var(--ui-shadow)}
.snd-btn:active{transform:translateY(3px);box-shadow:var(--sh-ui-active)}
.snd-btn svg{width:22px;height:22px;display:block}
.snd-btn.off{opacity:.5;filter:grayscale(1)}
.snd-btn.off::after{content:'';position:absolute;left:50%;top:50%;width:30px;height:3px;background:#c0392b;border-radius:2px;
  transform:translate(-50%,-50%) rotate(-45deg);box-shadow:0 0 2px #fff}
#dir-bar{background:rgba(255,255,255,.85);border-radius:var(--r-md);padding:7px 14px;font-size:var(--f-body);font-weight:900;color:var(--text);
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;letter-spacing:1px;
  box-shadow:var(--sh-ui-sm);border:1.5px solid var(--card-shadow)}
/* ====== 场景装饰（皮肤卡通背景） ====== */
#scene-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
/* 山丘：贴底分层、柔和可见（garden A） */
.scene-hill-t,.scene-hill-b{position:absolute;left:-50%;width:200%;border-radius:50% 50% 0 0}
.scene-hill-b{bottom:0;height:130px;opacity:.8}
.scene-hill-t{bottom:48px;height:96px;opacity:.9}
/* 蓬松云朵（garden A） */
.scene-cloud{position:absolute;background:rgba(255,255,255,.92);border-radius:40px;
  box-shadow:0 4px 14px rgba(120,160,150,.12);animation:cloudDrift 16s ease-in-out infinite}
.scene-cloud::before,.scene-cloud::after{content:"";position:absolute;background:rgba(255,255,255,.94);border-radius:50%}
.scene-cloud::before{width:62%;height:135%;top:-46%;left:8%}
.scene-cloud::after{width:48%;height:100%;top:-32%;right:12%}
/* 花朵：emoji 版（其它皮肤沿用） */
.scene-flower{position:absolute;width:40px;height:40px;opacity:.7}
/* 柔和太阳 / SVG 小花 / 蝴蝶（garden A） */
.scene-sun{position:absolute;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 40% 38%,#FFF4CF,#FFDD9B);
  box-shadow:0 0 10px 0 rgba(255,221,155,.32)}
.scene-flower-svg{position:absolute;opacity:.78;animation:flowerSway 4.5s ease-in-out infinite;transform-origin:bottom center}
.scene-butterfly{position:absolute;width:24px;height:20px;animation:bfFlutter 3.6s ease-in-out infinite}
.scene-butterfly .bf-wing{transform-origin:center;animation:bfFlap 1.5s ease-in-out infinite}
.scene-flower{position:absolute;width:40px;height:40px;opacity:.7}
.scene-star{position:absolute;color:rgba(255,255,255,.45);font-size:18px;animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.7;transform:scale(1.2)}}
.scene-wave{position:absolute;width:100%;height:3px;background:rgba(255,255,255,.12);border-radius:2px}
.scene-leaf{position:absolute;font-size:22px;opacity:.6;animation:leafFloat 4s ease-in-out infinite}
@keyframes leafFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(8deg)}}
.scene-heart{position:absolute;color:rgba(255,255,255,.35);font-size:15px;animation:heartFloat 3s ease-in-out infinite}
@keyframes heartFloat{0%,100%{transform:translateY(0) scale(1);opacity:.3}50%{transform:translateY(-12px) scale(1.15);opacity:.6}}
.scene-bubble{position:absolute;background:rgba(255,255,255,.15);border-radius:50%;animation:bubbleRise 5s ease-in infinite}
@keyframes bubbleRise{0%{transform:translateY(0) scale(1);opacity:.22}100%{transform:translateY(-80vh) scale(.5);opacity:0}}
.scene-aurora{position:absolute;width:200%;height:150px;top:10%;left:-50%;background:linear-gradient(180deg,transparent,rgba(100,200,255,.05),transparent);filter:blur(24px);animation:auroraDrift 8s ease-in-out infinite alternate}
@keyframes auroraDrift{0%{transform:translateX(-10%) skewX(-5deg)}100%{transform:translateX(10%) skewX(5deg)}}
@keyframes cloudDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
@keyframes sunBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes flowerSway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes bfFlutter{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(-5px,-10px) rotate(3deg)}}
@keyframes bfFlap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.6)}}
</style>
</head>
<body>
<svg id="svg-defs" xmlns="http://www.w3.org/2000/svg"><defs>
  <radialGradient id="gA" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#ff9a9a"/><stop offset=".5" stop-color="#ef4444"/><stop offset="1" stop-color="#b91c1c"/></radialGradient>
  <radialGradient id="gO" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ffd27a"/><stop offset=".55" stop-color="#ff9f1c"/><stop offset="1" stop-color="#e07b00"/></radialGradient>
  <linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b81"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
  <radialGradient id="gG" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#c79bf0"/><stop offset=".6" stop-color="#9b59d0"/><stop offset="1" stop-color="#6f3ba8"/></radialGradient>

<script>
const Sound={
  ctx:null,
  init(){
    if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    if(this.ctx){
      if(this.ctx.state==='suspended')this.ctx.resume();
      // 音乐专用总线：低通滤波(滤刺耳高频) + 总音量(比音效更轻)，避免背景乐发尖
      if(!this.musicBus){
        this.musicGain=this.ctx.createGain(); this.musicGain.gain.value=0.34;
        this.musicFilter=this.ctx.createBiquadFilter();
        this.musicFilter.type='lowpass'; this.musicFilter.frequency.value=3400; this.musicFilter.Q.value=0.4;
        this.musicFilter.connect(this.musicGain); this.musicGain.connect(this.ctx.destination);
        this.musicBus=this.musicFilter;
      }
    }
  },
  tone(f,dur,type='sine',vol=.06,when=0,dest=null){
    if(!this.ctx)return;
    const t=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g);g.connect(dest||this.ctx.destination);
    o.start(t);o.stop(t+dur+0.03);
  },
  chord(freqs,dur,type='sine',vol=.06,gap=0){ freqs.forEach((f,i)=>this.tone(f,dur,type,vol,i*gap)); },
  select(){ if(save.sfxOn===false)return; this.tone(620,.06,'sine',.05); },
  wrong(){ if(save.sfxOn===false)return; this.tone(170,.14,'sawtooth',.05); },
  win(){ if(save.sfxOn===false)return; this.chord([523,659,784,1047],.22,'triangle',.06,0.1); },
  shuffle(){ if(save.sfxOn===false)return; for(let i=0;i<6;i++)this.tone(250+Math.random()*400,.05,'square',.03,i*0.03); },
  coin(){ if(save.sfxOn===false)return; this.chord([784,1047],.12,'triangle',.06,0.06); },
  playMatch(){
    if(save.sfxOn===false)return;
    const p=SFX_PACKS.find(x=>x.id===save.activeSound)||SFX_PACKS[0];
    if(p.wave==='square') this.chord(p.seq,.09,'square',.05,0.05);
    else this.chord(p.seq,.14,p.wave||'sine',.06,0.06);
  },
  // ===== 背景音乐：世界名曲（明亮欢快、温润不机械） =====
  bgmTimer:null,
  bgmPlayingTrack:-1,
  // 旋律音：八音盒音色——正弦主音(圆润不刺耳) + 微弱八度泛音(光泽)，无颤音避免发飘发机械
  mnote(f,dur,vol,w,bus){
    if(!this.ctx)return;
    const t=this.ctx.currentTime+w, out=bus||this.ctx.destination;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.006); // 快起音(八音盒敲击感)
    g.gain.exponentialRampToValueAtTime(0.0005,t+dur); // 自然衰减
    g.connect(out);
    const o1=this.ctx.createOscillator(); o1.type='sine'; o1.frequency.value=f;
    o1.connect(g); o1.start(t); o1.stop(t+dur+0.05);
    // 八度泛音：微弱，增加明亮但柔和的八音盒光泽
    const g2=this.ctx.createGain();
    g2.gain.setValueAtTime(0.0001,t);
    g2.gain.linearRampToValueAtTime(vol*0.16,t+0.01);
    g2.gain.exponentialRampToValueAtTime(0.0004,t+dur*0.6);
    const o2=this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=f*2;
    o2.connect(g2); g2.connect(out);
    o2.start(t); o2.stop(t+dur*0.6+0.05);
  },
  // 低音：圆润正弦拨奏
  mbass(f,dur,vol,w,bus){
    if(!this.ctx)return;
    const t=this.ctx.currentTime+w, out=bus||this.ctx.destination;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0006,t+dur);
    g.connect(out);
    const o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    o.connect(g); o.start(t); o.stop(t+dur+0.05);
  },
  // 柔和长和弦垫(大三和弦)：缓慢起音、长时间铺垫，营造 QQ 农场般的安宁温暖底色
  mpad(semi,dur,vol,w,bus){
    if(!this.ctx)return;
    const root=fr(semi);
    [root, fr(semi+4), fr(semi+7)].forEach((f)=>{
      const t=this.ctx.currentTime+w, out=bus||this.ctx.destination;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(vol,t+0.3);
      g.gain.setValueAtTime(vol,t+dur*0.7);
      g.gain.exponentialRampToValueAtTime(0.0004,t+dur);
      g.connect(out);
      const o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
      o.connect(g); o.start(t); o.stop(t+dur+0.05);
    });
  },
  startBGM(){
    if(!this.ctx)this.init();
    if(!this.ctx||save.musicOn===false){ this.stopBGM(true); return; }
    const track=BGM_TRACKS[save.bgmTrack||0]||BGM_TRACKS[0];
    // 已在播放同一首：不重启（避免重复淡入）
    if(this.bgmTimer && this.bgmPlayingTrack===save.bgmTrack) return;
    if(this.bgmTimer) this.stopBGM(false); // 切歌：先停再起
    const bus=this.musicBus, beat=0.5; // 舒缓放松(参考 QQ 农场田园风)
    if(this.musicGain){
      const t=this.ctx.currentTime;
      this.musicGain.gain.cancelScheduledValues(t);
      this.musicGain.gain.setValueAtTime(Math.max(this.musicGain.gain.value,0.0001),t);
      this.musicGain.gain.linearRampToValueAtTime(0.34,t+0.5); // 渐入
    }
    let idx=0, loop=0, nextTime=this.ctx.currentTime+0.12;
    const N=track.notes.length;
    let phraseDur=0; for(let i=0;i<N;i++)phraseDur+=track.notes[i][1]*beat; // 乐句总时长(用于和弦垫)
    const sched=()=>{
      if(save.musicOn===false){this.stopBGM(true);return;}
      const horizon=this.ctx.currentTime+0.7;
      while(nextTime<horizon){
        const pos=idx%N;
        const nv=track.notes[pos];
        const semi=nv[0], beats=nv[1];
        const dur=beats*beat;
        const w=nextTime-this.ctx.currentTime;
        if(semi>-50){
          const f=fr(semi);
          this.mnote(f,dur*0.92,0.18,w,bus);          // 主旋律(八音盒·柔和)
          this.mbass(f/2,dur*0.9,0.08,w,bus);          // 低音衬托(圆润)
          if(loop%2===1) this.mnote(fr(semi+4),dur*0.9,0.045,w,bus); // 变奏：三度和音(温暖)
        }
        if(pos===0) this.mpad(track.notes[0][0],phraseDur*0.96,0.045,w,bus); // 每乐句铺一层柔和和弦垫
        nextTime+=dur;
        idx++;
        if(pos===N-1){ loop++; nextTime+=beat*2; } // 段落间留白
      }
    };
    sched();
    this.bgmTimer=setInterval(sched,250);
    this.bgmPlayingTrack=save.bgmTrack;
  },
  stopBGM(soft){
    if(this.bgmTimer){clearInterval(this.bgmTimer);this.bgmTimer=null;}
    this.bgmPlayingTrack=-1;
    if(soft!==false && this.musicGain && this.ctx){
      const t=this.ctx.currentTime;
      this.musicGain.gain.cancelScheduledValues(t);
      this.musicGain.gain.setValueAtTime(Math.max(this.musicGain.gain.value,0.0001),t);
      this.musicGain.gain.linearRampToValueAtTime(0.0001,t+0.25); // 快速淡出，确保能关掉
    }
  },
  previewBGM(idx){
    Sound.init();
    const wasPlaying=!!this.bgmTimer && save.musicOn;
    if(this.bgmTimer){clearInterval(this.bgmTimer);this.bgmTimer=null;}
    const bus=this.musicBus;
    if(this.musicGain&&this.ctx){
      const t=this.ctx.currentTime;
      this.musicGain.gain.cancelScheduledValues(t);
      this.musicGain.gain.setValueAtTime(Math.max(this.musicGain.gain.value,0.42),t);
      this.musicGain.gain.linearRampToValueAtTime(0.42,t+0.2);
    }
    const track=BGM_TRACKS[idx]||BGM_TRACKS[0];
    const beat=0.5; let t2=this.ctx.currentTime+0.06, total=0;
    for(let i=0;i<track.notes.length;i++){const nv=track.notes[i];total+=nv[1]*beat;}
    this.mpad(track.notes[0][0],total*0.98,0.05,0.06,bus); // 试听也铺一层柔和和弦垫
    for(let i=0;i<track.notes.length;i++){
      const nv=track.notes[i]; const semi=nv[0], beats=nv[1]; const dur=beats*beat;
      if(semi>-50){
        const f=fr(semi);
        this.mnote(f,dur*0.92,0.20,t2-this.ctx.currentTime,bus);
        this.mbass(f/2,dur*0.9,0.09,t2-this.ctx.currentTime,bus);
      }
      t2+=dur;
    }
    if(wasPlaying) setTimeout(()=>{ if(save.musicOn&&!this.bgmTimer) this.startBGM(); }, (total+0.5)*1000);
  }
};

// 切到后台/关闭页面时挂起音频上下文，避免退出后仍在后台播放；回到前台再恢复
(function(){
  function onVis(){
    if(!Sound.ctx)return;
    if(document.hidden){ if(Sound.ctx.state==='running')Sound.ctx.suspend(); }
    else { if(Sound.ctx.state==='suspended'&&save.musicOn!==false)Sound.ctx.resume(); }
  }
  document.addEventListener('visibilitychange',onVis);
  window.addEventListener('pagehide',()=>{ if(Sound.ctx&&Sound.ctx.state==='running')Sound.ctx.suspend(); });
  window.addEventListener('beforeunload',()=>{ if(Sound.ctx&&Sound.ctx.state==='running')Sound.ctx.suspend(); });
})();

// ====== 靠拢方向（随关卡递增难度） ======
// Lv 1-4:  单方向（↓←↑→）
// Lv 5-9:  双方向（往角落靠拢 ↙↘↖↗）
// Lv 10-14:三方向（往一条边挤压）
// Lv 15+:  四方向（向中心聚拢）
function collapseDirs(lv){
  // 规律：每 5 关为一个阶段，阶段内靠拢方式（类型+方向）完全一致，玩家可预判
  // 阶段类型按 单方向→双方向(角)→三方向(边)→中心聚拢 固定循环（每20关一轮）
  const stage=Math.floor((lv-1)/5);   // 阶段序号 0,1,2,...
  const mode=stage%4;                 // 0=单 1=双 2=三 3=中心
  const single=['down','left','up','right'];
  const corners=[['down','left'],['down','right'],['up','left'],['up','right']];
  const edges=[['up','left','right'],['down','left','right'],['left','up','down'],['right','up','down']];
  if(mode===0) return [single[stage%4]];
  if(mode===1) return corners[stage%4];
  if(mode===2) return edges[stage%4];
  return ['center'];
}
function collapseName(lv){
  const ds=collapseDirs(lv);
  if(ds[0]==='center') return '⊙ 中心聚拢';
  const m={down:'↓',up:'↑',left:'←',right:'→'};
  if(ds.length>=3){
    // 三方向=边挤压：朝"未列出的方向的反向"那条边贴合铺满
    const all=['up','down','left','right'];
    const missing=all.find(d=>!ds.includes(d));
    const target={up:'down',down:'up',left:'right',right:'left'}[missing];
    return m[target]+' 贴合';
  }
  return ds.map(d=>m[d]).join(' ')+' 靠拢';
}
function applyCollapse(){
  const dirs=collapseDirs(level), rows=ROWS(), cols=COLS();
  // 记录旧位置用于动画
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++) if(grid[r][c]){grid[r][c].prevR=r;grid[r][c].prevC=c;}
  if(dirs[0]==='center'){
    // 向中心聚拢：按曼哈顿距离排序，逐个放入最近空位
    applyCenterCollapse(rows,cols);
  }else if(dirs.length===1){
    applyLinearCollapse(dirs[0],rows,cols);
  }else if(dirs.length===2){
    applyCornerCollapse(dirs,rows,cols);
  }else{
    applyEdgeCollapse(dirs,rows,cols);
  }
}
function applyLinearCollapse(dir,rows,cols){
  const ng=Array(rows).fill().map(()=>Array(cols).fill(null));
  if(dir==='down'){for(let c=0;c<cols;c++){let i=0;for(let r=rows-1;r>=0;r--){if(grid[r][c]){ng[rows-1-i][c]=grid[r][c];i++;}}}
  }else if(dir==='up'){for(let c=0;c<cols;c++){let i=0;for(let r=0;r<rows;r++){if(grid[r][c]){ng[i][c]=grid[r][c];i++;}}}
  }else if(dir==='left'){for(let r=0;r<rows;r++){let i=0;for(let c=0;c<cols;c++){if(grid[r][c]){ng[r][i]=grid[r][c];i++;}}}
  }else{for(let r=0;r<rows;r++){let i=0;for(let c=cols-1;c>=0;c--){if(grid[r][c]){ng[r][cols-1-i]=grid[r][c];i++;}}}}
  grid=ng;
}
function applyCornerCollapse(dirs,rows,cols){
  // 先按主方向压缩，再按副方向压缩
  applyLinearCollapse(dirs[0],rows,cols);
  applyLinearCollapse(dirs[1],rows,cols);
}
function applyEdgeCollapse(dirs,rows,cols){
  // 三方向=边挤压：朝"未列出的方向的反向"那条边贴合铺满
  // （存活方块按行列顺序，从目标边起逐行/逐列填满，超出的向内延伸）
  const all=['up','down','left','right'];
  const missing=all.find(d=>!dirs.includes(d));
  const target={up:'down',down:'up',left:'right',right:'left'}[missing];
  const tiles=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(grid[r][c])tiles.push(grid[r][c]);
  const ng=Array(rows).fill().map(()=>Array(cols).fill(null));
  let k=0;
  if(target==='up'||target==='down'){
    const r0=target==='up'?0:rows-1, rstep=target==='up'?1:-1;
    for(let off=0; off<rows && k<tiles.length; off++){
      const r=r0+off*rstep;
      for(let c=0;c<cols && k<tiles.length;c++) ng[r][c]=tiles[k++];
    }
  }else{
    const c0=target==='left'?0:cols-1, cstep=target==='left'?1:-1;
    for(let off=0; off<cols && k<tiles.length; off++){
      const c=c0+off*cstep;
      for(let r=0;r<rows && k<tiles.length;r++) ng[r][c]=tiles[k++];
    }
  }
  grid=ng;
}
function applyCenterCollapse(rows,cols){
  const ng=Array(rows).fill().map(()=>Array(cols).fill(null));
  const cR=Math.floor(rows/2), cC=Math.floor(cols/2);
  // 收集所有存活方块，按到中心的曼哈顿距离排序
  const tiles=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(grid[r][c])tiles.push({cell:grid[r][c],dist:Math.abs(r-cR)+Math.abs(c-cC)});
  tiles.sort((a,b)=>a.dist-b.dist);
  // 按到中心距离从小到大填入空位
  const positions=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)positions.push({r,c,dist:Math.abs(r-cR)+Math.abs(c-cC)});
  positions.sort((a,b)=>a.dist-b.dist);
  let pi=0;
  for(const t of tiles){
    while(pi<positions.length&&ng[positions[pi].r][positions[pi].c])pi++;
    if(pi<positions.length){ng[positions[pi].r][positions[pi].c]=t.cell;pi++;}
  }
  grid=ng;
}
function onBorder(r,c){return r===0||r===ROWS()-1||c===0||c===COLS()-1;}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// 每关自动轮换图案：保留 50%，其余从 prev 之外的新图案中随机抽取替换
function rollTypes(prev,nTypes){
  const pool=allIconPool();
  if(!prev||prev.length===0) return shuffle(pool.slice()).slice(0,nTypes);
  const keepN=Math.floor(prev.length/2);
  const keep=shuffle(prev.slice()).slice(0,keepN);
  const fresh=shuffle(pool.filter(i=>!prev.includes(i))); // prev 之外的新图案
  let adds;
  if(fresh.length>=nTypes-keep.length){
    adds=fresh.slice(0,nTypes-keep.length); // 正常：全部换成新图案，正好替换约一半
  }else{
    // 图案池已用尽（极端高关），从其余图案兜底补齐，保证数量足够
    adds=shuffle(pool.filter(i=>!keep.includes(i))).slice(0,nTypes-keep.length);
  }
  return shuffle(keep.concat(adds));
}

function generateBoard(lv){
  level=lv;
  const rows=ROWS(), cols=COLS(), totalCells=rows*cols;
  grid=Array(rows).fill().map(()=>Array(cols).fill(null));
  const chosen=save.levelTypes.slice();
  const nTypes=chosen.length;
  // 保证每种图案数量都是偶数，总和恰好等于 totalCells
  let pool=[];
  const base=Math.floor(totalCells/nTypes);
  const evenBase=(base%2===0)?base:base-1;
  let assigned=0;
  for(let ti=0;ti<nTypes;ti++){
    pool.push(...Array(evenBase).fill(chosen[ti]));
    assigned+=evenBase;
  }
  // 剩余的（一定是偶数），按两两分配给各类型
  let rem=totalCells-assigned;
  for(let i=0;i<rem;i+=2){const ti=(i/2)%nTypes;pool.push(chosen[ti],chosen[ti]);}
  shuffle(pool);
  let idx=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
    if(idx<pool.length){grid[r][c]={icon:pool[idx],id:idx,el:null};idx++;}
  remaining=pool.length;total=remaining;
  ensureSolvable();renderBoard();updateUI();
}

const DIRS=[[-1,0],[1,0],[0,-1],[0,1]];
// 连连看连接：≤2 拐弯，且允许路径绕到棋盘“外圈”（格子外的那一圈视为永远空）
// 用 +1 外边距把棋盘扩成 (R+2)x(C+2)，真实格子(r,c)映射到(r+1,c+1)，外圈即边距格
function canConnect(r1,c1,r2,c2){
  if(r1===r2&&c1===c2)return false;
  if(!grid[r1][c1]||!grid[r2][c2])return false;
  if(grid[r1][c1].icon!==grid[r2][c2].icon)return false;
  const R=ROWS(),C=COLS();
  // 外圈只允许"厚 1 格"（nr∈[-1,R]、nc∈[-1,C]），避免路径越走越出界
  const passable=(r,c)=>{ if(r===r2&&c===c2)return true; if(r<0||r>=R||c<0||c>=C)return true; return grid[r][c]===null; };
  const inFrame=(r,c)=>r>=-1&&r<=R&&c>=-1&&c<=C;
  const vis=Array.from({length:R+2},()=>Array.from({length:C+2},()=>[99,99,99,99]));
  const q=[];
  for(let d=0;d<4;d++){vis[r1+1][c1+1][d]=0;q.push({r:r1,c:c1,dir:d,turns:0});}
  while(q.length){
    const cur=q.shift();
    for(let nd=0;nd<4;nd++){
      const nr=cur.r+DIRS[nd][0],nc=cur.c+DIRS[nd][1];
      const turns=cur.turns+(cur.dir===nd?0:1);
      if(turns>2)continue;
      if(!inFrame(nr,nc))continue;
      if(!passable(nr,nc))continue;
      const vr=nr+1,vc=nc+1;
      if(turns<vis[vr][vc][nd]){vis[vr][vc][nd]=turns;q.push({r:nr,c:nc,dir:nd,turns});}
    }
  }
  return vis[r2+1][c2+1].some(v=>v<=2);
}
function findPath(r1,c1,r2,c2){
  const R=ROWS(),C=COLS();
  const passable=(r,c)=>{ if(r===r2&&c===c2)return true; if(r<0||r>=R||c<0||c>=C)return true; return grid[r][c]===null; };
  const inFrame=(r,c)=>r>=-1&&r<=R&&c>=-1&&c<=C;
  const vis=Array.from({length:R+2},()=>Array.from({length:C+2},()=>[null,null,null,null]));
  const q=[];
  for(let d=0;d<4;d++){const s={r:r1,c:c1,dir:d,turns:0,prev:null};vis[r1+1][c1+1][d]=s;q.push(s);}
  let end=null;
  while(q.length){
    const cur=q.shift();
    if(cur.r===r2&&cur.c===c2){end=cur;break;}
    for(let nd=0;nd<4;nd++){
      const nr=cur.r+DIRS[nd][0],nc=cur.c+DIRS[nd][1];
      const turns=cur.turns+(cur.dir===nd?0:1);
      if(turns>2)continue;
      if(!inFrame(nr,nc))continue;
      if(!passable(nr,nc))continue;
      const vr=nr+1,vc=nc+1;
      if(!vis[vr][vc][nd]){const s={r:nr,c:nc,dir:nd,turns,prev:cur};vis[vr][vc][nd]=s;q.push(s);}
    }
  }
  if(!end)return null;
  const path=[];let p=end;while(p){path.unshift({r:p.r,c:p.c});p=p.prev;}
  return path;
}
function drawLine(path){
  const ts=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
  const gap=4, br=boardEl.getBoundingClientRect(), wr=wrapEl.getBoundingClientRect();
  let d='';
  path.forEach((pt,i)=>{
    const x=br.left-wr.left+pt.c*(ts+gap)+ts/2;
    const y=br.top-wr.top+pt.r*(ts+gap)+ts/2;
    d+=(i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
  });
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d);p.setAttribute('stroke','#ffe24a');p.setAttribute('stroke-width','5');
  p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');
  p.style.filter='drop-shadow(0 0 6px rgba(255,180,0,.9))';
  svgLines.appendChild(p);
  p.animate([{opacity:1,strokeWidth:7},{opacity:.9,strokeWidth:5},{opacity:0,strokeWidth:3}],{duration:380,easing:'ease-out'}).onfinish=()=>p.remove();
}
function spawnParticles(r,c){
  const ts=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
  const br=boardEl.getBoundingClientRect(),wr=wrapEl.getBoundingClientRect();
  const x=br.left-wr.left+c*(ts+4)+ts/2, y=br.top-wr.top+r*(ts+4)+ts/2;
  const colors=['#ffe24a','#FF6FA5','#5DD8C4','#fff','#ff5a8a'];
  for(let i=0;i<10;i++){
    const el=document.createElement('div');el.className='particle';
    const s=Math.random()*7+4;
    el.style.cssText=`width:${s}px;height:${s}px;background:${colors[i%colors.length]};left:${x}px;top:${y}px`;
    wrapEl.appendChild(el);
    const ang=Math.random()*Math.PI*2, dist=Math.random()*45+25;
    el.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist-30}px) scale(0)`,opacity:0}],{duration:500+Math.random()*200,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>el.remove();
  }
}
function onTileClick(r,c){
  if(!grid[r][c])return;
  Sound.init();
  if(selected){
    const sr=selected.r,sc=selected.c;
    if(sr===r&&sc===c){grid[sr][sc].el.classList.remove('selected');selected=null;Sound.select();return;}
    const sameIcon=grid[sr][sc].icon===grid[r][c].icon;
    const borderShortcut=sameIcon&&onBorder(sr,sc)&&onBorder(r,c);
    const can=canConnect(sr,sc,r,c)||borderShortcut;
    if(can){
      if(borderShortcut&&!canConnect(sr,sc,r,c))showCombo('外围消除!');
      matchTiles(sr,sc,r,c);
    }
    else{Sound.wrong();grid[sr][sc].el.classList.remove('selected');selected={r,c};grid[r][c].el.classList.add('selected');Sound.select();}
  }else{selected={r,c};grid[r][c].el.classList.add('selected');Sound.select();}
}
function matchTiles(r1,c1,r2,c2){
  const path=findPath(r1,c1,r2,c2);
  if(path)drawLine(path);
  grid[r1][c1].el.classList.add('matched');
  grid[r2][c2].el.classList.add('matched');
  setTimeout(()=>{
    spawnParticles(r1,c1);spawnParticles(r2,c2);
    grid[r1][c1]=null;grid[r2][c2]=null;
    applyCollapse();
    renderBoard();Sound.playMatch();
    combo++;if(combo>maxCombo)maxCombo=combo;
    score+=10+combo*2;
    if(combo>=2)showCombo('连击 x'+combo);
    remaining-=2;selected=null;updateUI();
    if(remaining===0){combo=0;Sound.win();setTimeout(showWin,500);return;}
    if(!hasAnyMatch()){combo=0;setTimeout(showStuck,400);}
  },330);
}
function showCombo(t){const el=document.getElementById('combo-pop');el.textContent=t;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');}
function hasAnyMatch(){
  const ts=[];
  for(let r=0;r<ROWS();r++)for(let c=0;c<COLS();c++)if(grid[r][c])ts.push({r,c,i:grid[r][c].icon});
  for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++){
    const a=ts[i],b=ts[j];
    // 普通连线 或 外围消除（两个同图案都在最外圈，免连线）
    if(a.i===b.i && (canConnect(a.r,a.c,b.r,b.c) || (onBorder(a.r,a.c)&&onBorder(b.r,b.c)))) return true;
  }
  return false;
}
function findAHint(){
  const ts=[];
  for(let r=0;r<ROWS();r++)for(let c=0;c<COLS();c++)if(grid[r][c])ts.push({r,c,i:grid[r][c].icon});
  for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++){
    const a=ts[i],b=ts[j];
    if(a.i===b.i && (canConnect(a.r,a.c,b.r,b.c) || (onBorder(a.r,a.c)&&onBorder(b.r,b.c)))) return [a,b];
  }
  return null;
}
function useHint(){if(save.items.hint<=0)return;const p=findAHint();if(!p){showStuck();return;}save.items.hint--;saveGame();const[a,b]=p;grid[a.r][a.c].el.classList.add('hint');grid[b.r][b.c].el.classList.add('hint');setTimeout(()=>{if(grid[a.r][a.c])grid[a.r][a.c].el.classList.remove('hint');if(grid[b.r][b.c])grid[b.r][b.c].el.classList.remove('hint');},2200);updateUI();}
function shuffleRemaining(snd=true){
  const ts=[];
  for(let r=0;r<ROWS();r++)for(let c=0;c<COLS();c++)if(grid[r][c])ts.push({r,c,i:grid[r][c].icon});
  const icons=ts.map(t=>t.i);
  shuffle(icons);
  ts.forEach((t,i)=>grid[t.r][t.c].icon=icons[i]);
  if(snd)Sound.shuffle();renderBoard();updateUI();
}
function useRefresh(){if(save.items.refresh<=0)return;save.items.refresh--;saveGame();combo=0;shuffleRemaining(true);ensureSolvable();updateUI();}
function useBomb(){if(save.items.bomb<=0)return;const p=findAHint();if(!p){showStuck();return;}save.items.bomb--;saveGame();if(selected&&grid[selected.r][selected.c])grid[selected.r][selected.c].el.classList.remove('selected');selected=null;matchTiles(p[0].r,p[0].c,p[1].r,p[1].c);updateUI();}
function showWin(){
  const reward=50+level*30+maxCombo*5;
  save.coins+=reward;Sound.coin();
  if(level>=save.best)save.best=level+1;
  if(level+1>save.level)save.level=level+1;
  saveGame();
  document.getElementById('win-text').textContent=`第 ${level} 关完成！得分 ${score}`;
  document.getElementById('win-reward').textContent=`获得金币 +${reward}（连击奖励 ${maxCombo*5}）`;
  document.getElementById('win-screen').classList.remove('hidden');
  updateUI();}
function showStuck(){document.getElementById('stuck-screen').classList.remove('hidden');}

function renderScene(sc){
  const layer=document.getElementById('scene-layer');if(!layer)return;

  // 山坡（顶部+底部）
  if(sc.hills){
    const ht=document.createElement('div');ht.className='scene-hill-t';
    ht.style.background=sc.hills[0];layer.appendChild(ht);

      layer.appendChild(w);

  // 爱心飘浮

      h.style.cssText=`left:${5+Math.random()*90}%;top:${10+Math.random()*50}%;animation-delay:${Math.random()*3}s`;
      layer.appendChild(h);

  // 花朵/四叶草
  if(sc.flowers){
    const fp=[[5,75,'32px','0deg'],[88,72,'36px','15deg'],[92,8,'28px','-10deg'],[3,12,'30px','10deg']];
    fp.forEach(([l,t,sz,rot])=>{

      f.style.cssText=`left:${l}%;bottom:${t}%;font-size:${sz};transform:rotate(${rot})`;layer.appendChild(f);

      layer.appendChild(h);

  if(sc.decor==='star'){
    for(let i=0;i<6;i++){
      const s=document.createElement('div');s.className='scene-star';s.textContent='✧';
      s.style.cssText=`left:${8+Math.random()*84}%;top:${10+Math.random()*50}%;font-size:${14+Math.random()*16}px;animation-delay:${Math.random()*2}s`;
      layer.appendChild(s);

document.getElementById('auto-shuffle-btn').onclick=()=>{document.getElementById('stuck-screen').classList.add('hidden');shuffleRemaining(true);ensureSolvable();};document.getElementById('retry-stuck-btn').onclick=()=>{document.getElementById('stuck-screen').classList.add('hidden');startGame(level);};
document.getElementById('tool-hint').onclick=useHint;
document.getElementById('tool-refresh').onclick=useRefresh;
document.getElementById('tool-bomb').onclick=useBomb;
document.getElementById('btn-music').onclick=function(){Sound.init();save.musicOn=!save.musicOn;if(save.musicOn)Sound.startBGM();else Sound.stopBGM(true);updateSoundButtons();saveGame();};
document.getElementById('btn-sfx').onclick=function(){Sound.init();save.sfxOn=!save.sfxOn;if(save.sfxOn)Sound.select();updateSoundButtons();saveGame();};

function startGame(lv){
  score=0;combo=0;maxCombo=0;selected=null;
  const nTypes=Math.min(FULL_ICONS.length, 7+lv);
  if(pendingRoll && save.levelTypes && save.levelTypes.length){
    save.levelTypes=rollTypes(save.levelTypes, nTypes); // 下一关：自动替换 50% 图案
  }else if(!save.levelTypes || save.levelTypes.length!==nTypes){
    save.levelTypes=rollTypes(null, nTypes); // 首发/类型数变化/重玩：重抽一套
  }
  pendingRoll=false;
  saveGame();
  setTileSize();
  generateBoard(lv);
  if(save.musicOn)Sound.startBGM();
}
window.addEventListener('resize',()=>{setTileSize();if(grid.length)renderBoard();});

applySkin();

openHome();
